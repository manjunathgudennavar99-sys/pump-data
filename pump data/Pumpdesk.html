<title>Pump Desk</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ebed; --card:#ffffff; --ink:#15191e; --mute:#5d6873; --line:#d3d9de;
  --panel:#11161b; --amber:#ffb81c; --amber-dim:#7a5a12;
  --petrol:#d8472b; --premium:#6a4cc9; --diesel:#1c7a6b;
  --ok:#1c7a6b; --warn:#b36b00; --bad:#c0392b; --btn:#15191e; --btn-ink:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1115; --card:#171d23; --ink:#eef1f3; --mute:#97a3ae; --line:#27303a;
    --panel:#06090c; --btn:#eef1f3; --btn-ink:#11161b;
    --petrol:#ef6a50; --premium:#9b82ee; --diesel:#3fb8a5;
    --ok:#3fb8a5; --warn:#f0a030; --bad:#ef6a50;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1115; --card:#171d23; --ink:#eef1f3; --mute:#97a3ae; --line:#27303a;
  --panel:#06090c; --btn:#eef1f3; --btn-ink:#11161b;
  --petrol:#ef6a50; --premium:#9b82ee; --diesel:#3fb8a5;
  --ok:#3fb8a5; --warn:#f0a030; --bad:#ef6a50;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 100px}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0;font-weight:600}
h2{font-size:22px;margin:18px 0 8px}
h3{font-size:19px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 6px}
.top h1{font-size:26px}
.top span{color:var(--mute);font-size:14px}
.mute{color:var(--mute)} .sm{font-size:14px} .bad{color:var(--bad)} .okc{color:var(--ok)} .warnc{color:var(--warn)}

.display{background:var(--panel);border-radius:14px;padding:14px 16px 12px;border:1px solid #000;box-shadow:inset 0 0 0 3px #1d252d;margin-top:8px}
.display .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.display small{color:#8793a0;font-size:13px;display:block}
.display .big{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--amber);font-size:56px;line-height:1;letter-spacing:1px;font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis}
.display .mid{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--amber);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.display .foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:#8793a0;font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;font:inherit;font-size:17px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
input[type=search]{-webkit-appearance:none;appearance:none}
textarea{width:100%;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:120px}
textarea:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.chk{display:flex;gap:8px;align-items:center;margin:0;font-size:14px;color:var(--ink)}
.chk input{width:20px;height:20px;padding:0}
.go{width:100%;margin-top:14px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:600;padding:13px;cursor:pointer}
.go:disabled{opacity:.35;cursor:not-allowed}
.btn2{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;font:inherit;cursor:pointer}
.btn2.danger{color:var(--bad);border-color:var(--bad)}
.x{border:0;background:transparent;color:var(--mute);font-size:13px;cursor:pointer;padding:2px 0;text-decoration:underline;font-family:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-weight:500;padding:10px 4px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--mute);font-size:13px;display:block}
.stat b{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:600;font-variant-numeric:tabular-nums}
.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:10px;font-variant-numeric:tabular-nums}
.line:last-child{border-bottom:0}
.line.strong{font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.nzh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nzg{display:grid;grid-template-columns:1.15fr 1.15fr .85fr;gap:8px;align-items:end;margin-top:10px}
.nzg small{display:block;color:var(--mute);font-size:13px;margin-bottom:3px}
.nzg b{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;display:block;padding:8px 0}
.nzg input{padding:9px 10px;font-size:17px}
.nzf{display:flex;justify-content:space-between;margin-top:2px;font-size:14px;min-height:20px;font-variant-numeric:tabular-nums}
.nz{border-left:5px solid var(--c)}
.nzt{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;align-items:end;margin-top:10px}
.nzt small{display:block;color:var(--mute);font-size:13px;margin-bottom:3px}
.nzt input{padding:9px 10px;font-size:16px}

.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .l{min-width:0}
.item .l small,.item .r small{display:block;color:var(--mute);font-size:13px}
.item .r{text-align:right;font-variant-numeric:tabular-nums}
.tap{cursor:pointer}
.empty{color:var(--mute);padding:4px 0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:6px}

details.card summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary small{display:block;color:var(--mute);font-size:13px}
details.card summary .r{text-align:right}
details .body{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.tr{display:grid;grid-template-columns:1.2fr 1.4fr .9fr 1fr;gap:6px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tr.h{color:var(--mute);font-size:13px}
.tr span:last-child{text-align:right}
.mph{margin:14px 0 4px;padding-top:10px;border-top:2px solid var(--line)}

details.den{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.den summary{cursor:pointer;font-weight:500}
.denrow{display:grid;grid-template-columns:1fr 84px 104px;gap:8px;align-items:center;margin-top:8px}
.denrow label{margin:0;color:var(--ink)}
.denrow input{padding:8px;font-size:16px}
.denrow span{text-align:right;font-variant-numeric:tabular-nums}

.setrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:8px;align-items:center}
.setrow .full{grid-column:1/-1}
.setrow input,.setrow select{font-size:16px;padding:10px}
.sep{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:11.5px;font-weight:500;padding:10px 0;border-radius:10px;cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);background:var(--bg);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:1}
.hide{display:none}
.nodl .exp-btn{display:none}
.tr6{display:grid;grid-template-columns:1.6fr .75fr .75fr .75fr .8fr .8fr;gap:6px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tr6.h{color:var(--mute);font-size:13px}
.tr6 span:not(:first-child){text-align:center}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dayh{text-align:center;color:var(--mute);font-size:12px}
.dayb{text-align:center;padding:7px 0;border-radius:6px;font-size:13px;background:var(--bg);color:var(--mute);font-variant-numeric:tabular-nums}
.dayb.P{background:var(--ok);color:#fff}.dayb.H{background:var(--warn);color:#fff}.dayb.A{background:var(--bad);color:#fff}.dayb.L{background:var(--line);color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.mcard{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
.big2{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:15px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

  function migrate(o){
    if(!o.pricesV){
      o.fuels.forEach(function(f){if(f.id==='p'&&f.price===100)f.price=111.44;if(f.id==='d'&&f.price===92)f.price=99.34;});
      o.pricesV=1;
    }
    o.customers.forEach(function(c){if(!c.acc)c.acc=nextAcc(o.customers);});
    if(!o.mpds||!o.mpds.length)o.mpds=[{id:'m1',name:'MPD 1'}];
    var half=Math.ceil(o.nozzles.length/2);
    o.nozzles.forEach(function(n,i){
      if(!n.mpd||!o.mpds.some(function(m){return m.id===n.mpd;}))n.mpd=(i<half||o.mpds.length<2)?o.mpds[0].id:o.mpds[1].id;
    });
    if(o.att&&!o.atts[o.mpds[0].id])o.atts[o.mpds[0].id]=o.att;
    o.fuels.forEach(function(f){if(!o.fstock[f.id])o.fstock[f.id]={stock:null,cap:0,min:0};});
    Object.keys(DEFAULT_CHARTS).forEach(function(k){var t=o.fstock[k];if(t&&!t.chart){t.chart=DEFAULT_CHARTS[k].pts;t.unit=DEFAULT_CHARTS[k].unit||'cm';if(!(t.cap>0))t.cap=DEFAULT_CHARTS[k].cap||t.chart[t.chart.length-1][1];}});
    var nz=o.nozzles;
    if(!o.shift&&!o.shifts.length&&nz.length===4&&o.mpds.length===2&&o.mpds[0].id==='m1'&&o.mpds[1].id==='m2'&&
       nz.every(function(n,i){return n.id==='n'+(i+1)&&n.name==='Nozzle '+(i+1);})&&
       ['p,d,p,d','p,p,d,d'].indexOf(nz.map(function(n){return n.fuel;}).join(','))>=0&&
       nz.map(function(n){return n.mpd;}).join(',')==='m1,m1,m2,m2')o.nozzles=defNozzles();

       n8.map(function(n){return n.fuel;}).join(',')==='p,p,d,d,p,p,d,d')n8.forEach(function(n,i){n.fuel=['d','d','p','p'][i%4];});
    var sh=o.shift;
    if(sh&&!sh.mp){
      var m0=o.mpds[0];
      sh.nz.forEach(function(n){n.mpd=m0.id;});
      sh.mp=[{id:m0.id,name:m0.name,att:sh.att||'',cash:sh.cash||'',upi:sh.upi||'',card:sh.card||'',cashNote:sh.cashNote||'',den:sh.den||{}}];
    }
  }

      var G=(filled&&!bad)?r2(c-n.open):0,T=am(n.test),bad2=filled&&!bad&&T>G+0.0001;
      var L=(filled&&!bad&&!bad2)?r2(G-T):0,terr=pf(n.terr),errOut=!isNaN(terr)&&Math.abs(terr)>tolFor(T);
      return {id:n.id,name:n.name,fuel:n.fuel,mpd:n.mpd,open:n.open,open0:n.open0,close:filled?c:null,price:price,L:L,A:r2(L*price),G:G,T:T,terr:isNaN(terr)?null:terr,errOut:errOut,bad2:bad2,filled:filled,bad:bad};
    });
    var sale=0,lit=0,credit=0,rec=0,exp=0;
    rows.forEach(function(r){sale+=r.A;lit+=r.L;});
    S.ledger.forEach(function(e){if(e.shift===sh.id&&mpFor(sh,e.mpd)===m.id){if(e.type==='sale')credit+=e.A;else if(e.type==='pay')rec+=e.A;}});
    S.expenses.forEach(function(e){if(e.shift===sh.id&&mpFor(sh,e.mpd)===m.id)exp+=e.A;});
    var oil=0;S.oilSales.forEach(function(e){if(e.shift===sh.id&&mpFor(sh,e.mpd)===m.id)oil+=e.A;});
    var cash=am(m.cash),upi=am(m.upi),card=am(m.card);
    sale=r2(sale);credit=r2(credit);rec=r2(rec);exp=r2(exp);oil=r2(oil);
    var recv=r2(cash+upi+card),expect=r2(sale+oil-credit-exp+rec);
    return {id:m.id,name:m.name,att:m.att,rows:rows,sale:sale,oil:oil,lit:r2(lit),credit:credit,rec:rec,exp:exp,cash:cash,upi:upi,card:card,recv:recv,expect:expect,diff:r2(recv-expect),
      cashNote:m.cashNote||'',den:m.den||{},ready:rows.length>0&&rows.every(function(r){return r.filled&&!r.bad&&!r.bad2;})};

  function calc(sh){
    var mps=sh.mp.map(function(m){return calcMp(sh,m);});

    mps.forEach(function(m){
      t.rows=t.rows.concat(m.rows);
      ['sale','oil','lit','credit','rec','exp','cash','upi','card','recv','expect','diff'].forEach(function(k){t[k]=r2(t[k]+m[k]);});

  }

  var armClose=false,armT;

  function startMps(){return S.mpds.filter(function(m){var cb=document.querySelector('[data-use="'+m.id+'"]');return cb&&cb.checked;});}
  function checkStart(){

      nz:S.nozzles.filter(function(n){return use.some(function(m){return m.id===n.mpd;});}).map(function(n){

  function closeShift(){
    var sh=S.shift,c=calc(sh);if(!c.ready)return;
    var endT=sh.endT?new Date(sh.endT).getTime():Date.now();if(isNaN(endT))endT=Date.now();
    if(endT<sh.t0){toast('The closing time is before the start time');return;}
    var early=sh.mp.filter(function(m){var t=m.endT?new Date(m.endT).getTime():endT;return isNaN(t)||t<sh.t0;});
    if(early.length){toast(early[0].name+' closing time is before the shift start');return;}
    var b=$('closeShift'),off=c.mps.filter(function(m){return m.diff!==0;});
    if(off.length&&!armClose){
      armClose=true;b.textContent=off.map(function(m){return m.name+' '+diffText(m.diff);}).join(' \u00B7 ')+' \u2013 tap again to close';
      clearTimeout(armT);armT=setTimeout(function(){armClose=false;if($('closeShift'))updateShift();},6000);return;
    }
    armClose=false;clearTimeout(armT);
    sh.t1=endT;sh.att=attList(sh);
    sh.res={rows:c.rows.map(simpleRow),mps:c.mps.map(simpleMp),
      sale:c.sale,oil:c.oil,lit:c.lit,credit:c.credit,rec:c.rec,exp:c.exp,cash:c.cash,upi:c.upi,card:c.card,recv:c.recv,expect:c.expect,diff:c.diff};
    sh.res.mps.forEach(function(rm,i){var raw=sh.mp[i].endT,t=raw?new Date(raw).getTime():endT;rm.t1=isNaN(t)?endT:t;});
    deductFuel(sh,c);

    toast('Shift closed');render();

  /* ================= CREDIT ================= */
  function nextAcc(list){var m=0;list.forEach(function(c){var n=parseInt(String(c.acc||'').replace(/\D/g,''),10);if(n>m)m=n;});return 'CR-'+String(m+1).padStart(3,'0');}
  function oldDues(id){var t=0,d=null;S.ledger.forEach(function(e){if(e.cust===id&&e.type==='open'){t+=e.A;if(d===null||e.t<d)d=e.t;}});return {A:r2(t),t:d};}
  function dueOf(c){return c.due==null?30:c.due;}
  function entryPlain(e){
    var sx=e.sn?' \u00B7 '+e.sn+(e.mn?', '+e.mn:'')+(e.att?', '+e.att:''):'';
    if(e.type==='open')return 'Opening balance (earlier dues)'+(e.was!=null?' \u00B7 changed from '+S.cur+fmt(e.was):'');
    if(e.type==='sale'&&e.item)return 'Credit sale \u00B7 '+e.item+' \u00D7 '+e.q+sx;
    if(e.type==='sale')return 'Credit sale \u00B7 '+fuelBy(e.fuel).name+' '+fmt(e.L)+' L'+(e.veh?' \u00B7 '+e.veh:'')+sx;

  function aging(c){
    var L=S.ledger.filter(function(e){return e.cust===c.id;}).sort(function(a,b){return a.t-b.t;}),q=[],paid=0,now=Date.now(),due=dueOf(c);
    L.forEach(function(e){if(e.type==='pay')paid+=e.A;else q.push({t:e.t,A:e.A});});
    q.forEach(function(x){var u=Math.min(x.A,paid);x.A=r2(x.A-u);paid=r2(paid-u);});
    var open=q.filter(function(x){return x.A>0.004;}),over=0;
    if(due>0)open.forEach(function(x){if((now-x.t)/864e5>due)over+=x.A;});
    return {over:r2(over),days:open.length?Math.floor((now-open[0].t)/864e5):0};
  }
  function stmtData(c,per){
    var now=Date.now(),from=0,label='All time';
    if(per==='month'){var d=new Date();from=new Date(d.getFullYear(),d.getMonth(),1).getTime();label=d.toLocaleDateString(undefined,{month:'long',year:'numeric'});}
    else if(per==='30'){from=now-30*864e5;label='Last 30 days';}
    var L=S.ledger.filter(function(e){return e.cust===c.id;}).sort(function(a,b){return a.t-b.t;}),run=0,open=0,rows=[],cr=0,pd=0;
    L.forEach(function(e){
      var sign=e.type==='pay'?-1:1;
      run=r2(run+sign*e.A);
      if(e.t<from){open=run;}
      else{rows.push({e:e,bal:run});if(sign>0)cr+=e.A;else pd+=e.A;}
    });
    return {rows:rows,open:open,close:run,cr:r2(cr),pd:r2(pd),label:label};
  }
  function stmtText(c,per){
    var s=stmtData(c,per);
    var lines=[(S.pump||'Pump Desk')+' \u2013 Account statement','Customer: '+c.name+' ('+c.acc+')','Period: '+s.label,'Opening balance: '+money(s.open),''];
    s.rows.forEach(function(r){lines.push(dt(r.e.t)+'  '+entryPlain(r.e)+'  '+(r.e.type==='pay'?'-':'+')+money(r.e.A)+'  Balance '+money(r.bal));});
    lines.push('','Credit taken: '+money(s.cr),'Payments received: '+money(s.pd),'Closing balance: '+money(s.close));
    if(c.limit>0)lines.push('Credit limit: '+money(c.limit));
    return lines.join('\n');
  }

  /* every block goes into one sheet, one under the other */
  function finishBook(wb,secs){
    var rows=[],W=[];
    secs.forEach(function(sec,i){
      if(i>0){rows.push([],[],['\u25A0 '+sec.name.toUpperCase()]);}
      sec.rows.forEach(function(r){rows.push(r);});
      sec.widths.forEach(function(w,j){W[j]=Math.max(W[j]||0,w);});
    });
    lastRows=rows;
    if(wb)XLSX.utils.book_append_sheet(wb,xlSheet(rows,W),'Shift report');
    return wb;
  }
  var XLS_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  var xfile=null;
  function rowsToTsv(rows){
    return rows.map(function(r){return r.map(function(c){return String(c==null?'':c).replace(/[\t\r\n]+/g,' ');}).join('\t');}).join('\n');
  }
  function sendBook(wb,rows,name){
    var tsv=rowsToTsv(rows||[]),bytes=null;
    if(wb){
      try{
        var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
        bytes=(buf instanceof ArrayBuffer||ArrayBuffer.isView(buf))?buf:new Uint8Array(buf);
      }catch(e){bytes=null;}
    }
    xfile={name:name,bytes:bytes,tsv:tsv};
    var p=null;
    try{p=(window.claude&&window.claude.use)?window.claude.use('downloads'):null;}catch(e){p=null;}
    Promise.resolve(p).then(function(dl){
      if(dl&&bytes){
        return dl.save({filename:name,data:bytes.slice(0)}).then(function(){toast('Excel file ready');});
      }
      openExportSheet();
    }).catch(function(err){
      if(err&&err.code==='declined')return;
      openExportSheet();
    });
  }
  function exportShift(id){
    var sh=S.shifts.filter(function(x){return x.id===id;})[0];

    var wb=null;lastRows=null;

    sendBook(wb,lastRows,'Pump-'+sh.date+'-'+sh.name+'-'+tm(sh.t0).replace(/\D/g,'')+'.xlsx');
  }

    return by;

  function fuelPending(f,sold){var fa=(S.shift&&S.shift.fa&&S.shift.fa[f])||0;return Math.max(0,r2((sold[f]||0)-fa));}
  function fuelNow(f,sold){var fs=S.fstock[f];return(fs&&fs.stock!=null)?r2(fs.stock-fuelPending(f,sold)):null;}
  function avgDaily(f){
    var cut=Date.now()-7*864e5,l=0,first=null;
    S.shifts.forEach(function(sh){

    if(!l)return 0;

  function deductFuel(sh,c){

    Object.keys(by).forEach(function(f){

      fs.stock=r2(fs.stock-L);

  /* dip chart: height -> litres, with straight-line steps between the readings on the chart */
  function parseChart(txt){
    var pts={},bad=null;
    String(txt||'').split(/\r?\n/).forEach(function(line,i){
      var toks=line.trim().split(/[\s;:=|]+/).filter(Boolean);
      if(toks.length===1&&toks[0].indexOf(',')>0)toks=toks[0].split(',');
      var nums=toks.map(function(t){return Number(t.replace(/,/g,''));}).filter(function(n){return isFinite(n);});
      if(nums.length<2||toks.length<2)return;
      if(nums[0]<0||nums[1]<0){bad=bad||('Line '+(i+1)+' has a negative number');return;}
      pts[nums[0]]=nums[1];
    });
    var arr=Object.keys(pts).map(function(k){return [Number(k),pts[k]];}).sort(function(a,b){return a[0]-b[0];});
    if(bad)return {error:bad};
    if(arr.length<2)return {error:'Add at least two readings, one per line: the height, then the litres'};
    for(var i=1;i<arr.length;i++){if(arr[i][1]<arr[i-1][1])return {error:'Litres should go up as the height goes up. Check around '+arr[i][0]};}
    return {pts:arr};
  }
  function chartInfo(fs){
    var c=fs&&fs.chart;if(!c||c.length<2)return null;
    return {n:c.length,lo:c[0][0],hi:c[c.length-1][0],lmin:c[0][1],lmax:c[c.length-1][1]};
  }
  function chartLitres(c,h){
    if(!c||c.length<2||isNaN(h)||h<c[0][0]||h>c[c.length-1][0])return null;
    for(var i=0;i<c.length;i++){
      if(h===c[i][0])return c[i][1];
      if(i<c.length-1&&h>c[i][0]&&h<c[i+1][0])return r2(c[i][1]+(h-c[i][0])*(c[i+1][1]-c[i][1])/(c[i+1][0]-c[i][0]));
    }
    return null;
  }

  function dipLive(t){

  /* ================= DAY REPORT ================= */
  var DAY_KEYS=['lit','test','sale','oil','total','credit','exp','rec','expect','cash','upi','card','recv','diff','short','excess'];
  function ln(label,val,cls){return '<div class="line'+(cls?' '+cls:'')+'"><span>'+label+'</span><span>'+val+'</span></div>';}
  function shiftTotals(s){
    var r=s.res,t={by:{},test:0,short:0,excess:0};
    mpsOf(s).forEach(function(m){t.short=r2(t.short+shortOf(m.diff));t.excess=r2(t.excess+excessOf(m.diff));});
    t.lit=r.lit||0;t.sale=r.sale||0;t.oil=r.oil||0;t.total=r2(t.sale+t.oil);t.credit=r.credit||0;t.exp=r.exp||0;t.rec=r.rec||0;
    t.expect=r.expect||0;t.cash=r.cash||0;t.upi=r.upi||0;t.card=r.card||0;t.recv=r.recv||0;t.diff=r.diff||0;
    (r.rows||[]).forEach(function(x){
      t.test=r2(t.test+(x.T||0));
      var b=t.by[x.fuel]=t.by[x.fuel]||{L:0,A:0};b.L=r2(b.L+x.L);b.A=r2(b.A+x.A);
    });
    return t;
  }
  /* everything for one calendar day, from the shifts that started on it */
  function dayData(key){
    var shifts=S.shifts.filter(function(s){return s.date===key;}).sort(function(a,b){return a.t0-b.t0;});
    var ids={},T={by:{}};
    DAY_KEYS.forEach(function(k){T[k]=0;});
    var items=shifts.map(function(s){
      ids[s.id]=true;var t=shiftTotals(s);
      DAY_KEYS.forEach(function(k){T[k]=r2(T[k]+t[k]);});
      Object.keys(t.by).forEach(function(f){var b=T.by[f]=T.by[f]||{L:0,A:0};b.L=r2(b.L+t.by[f].L);b.A=r2(b.A+t.by[f].A);});
      return {s:s,t:t};
    });
    var nz={},order=[];
    shifts.forEach(function(s){(s.res.rows||[]).forEach(function(x){
      if(!nz[x.id]){nz[x.id]={name:x.name,fuel:x.fuel,mpd:x.mpd,first:x.open,last:x.close,L:0,T:0,A:0};order.push(x.id);}
      var n=nz[x.id];n.last=x.close;n.L=r2(n.L+x.L);n.T=r2(n.T+(x.T||0));n.A=r2(n.A+x.A);
    });});
    var oil={},oilQ=0;
    S.oilSales.forEach(function(e){
      if(!ids[e.shift])return;
      var k=oilLabel(e);oil[k]=oil[k]||{q:0,A:0};oil[k].q=r2(oil[k].q+e.q);oil[k].A=r2(oil[k].A+e.A);oilQ=r2(oilQ+e.q);
    });
    var cs={},pays=[];
    S.ledger.forEach(function(e){
      if(!ids[e.shift])return;
      var c=custBy(e.cust)||{name:'Customer',acc:''};
      if(e.type==='sale'){
        var o=cs[e.cust]=cs[e.cust]||{name:c.name,acc:c.acc,L:0,oilA:0,A:0};
        if(e.item)o.oilA=r2(o.oilA+e.A);else o.L=r2(o.L+e.L);
        o.A=r2(o.A+e.A);
      }else if(e.type==='pay'){pays.push({t:e.t,name:c.name,acc:c.acc,mode:e.mode||'Cash',A:e.A,att:e.att||''});}
    });
    var ex={},exTot=0;
    S.expenses.forEach(function(e){if(!ids[e.shift])return;ex[e.cat]=r2((ex[e.cat]||0)+e.A);exTot=r2(exTot+e.A);});
    var attRows=S.staff.filter(function(x){return x.active!==false||attBy(x.id,key);}).map(function(x){
      var a=attBy(x.id,key)||{};return {name:x.name,role:x.role||'',st:a.st||'',tin:a.tin||'',tout:a.tout||'',shift:a.shift||'',note:a.note||''};

  function dayRows(d){

    function title(t){rows.push([],[],['\u25A0 '+t]);}
    rows.push([S.pump||'Pump Desk'],['Final day sales report'],[],['Date',longDate(d.key)],['Shifts included',items.length],[],['Shift','Attendants','Start','Closing']);
    items.forEach(function(x){rows.push([x.s.name,x.s.att||'',dtf(x.s.t0),dtf(x.s.t1)]);});
    rows.push([],['Item'].concat(names,['Day total']));
    [['Fuel sold (litres)','lit'],['Test litres (not sold)','test'],['Fuel sale','sale'],['Oil sales','oil'],['Total sales','total'],['Credit given','credit'],['Expenses paid','exp'],['Old dues collected','rec'],['Expected collection','expect'],['Cash in hand','cash'],['UPI','upi'],['Card','card'],['Total received','recv'],['Net difference (short -, excess +)','diff'],['Short amount','short'],['Excess amount','excess']].forEach(function(p){rows.push(line(p[0],p[1]));});
    rows.push(line('Status','diff',diffText));
    S.fuels.forEach(function(f){
      if(!T.by[f.id])return;
      rows.push([f.name+' litres'].concat(items.map(function(x){return (x.t.by[f.id]||{L:0}).L;}),[T.by[f.id].L]));
      rows.push([f.name+' amount'].concat(items.map(function(x){return (x.t.by[f.id]||{A:0}).A;}),[T.by[f.id].A]));

    title('BY MPD AND ATTENDANT');

    items.forEach(function(x){mpsOf(x.s).forEach(function(m){
      rows.push([x.s.name,m.id==='all'?'':m.name,m.att||'',m.lit,m.sale,m.oil||0,m.credit,m.exp,m.rec,m.expect,m.cash,m.upi,m.card,m.recv,m.diff,shortOf(m.diff),excessOf(m.diff),dtf(x.s.t0),dtf(m.t1||x.s.t1)]);
    });});

    title('METER READINGS FOR THE DAY');

    d.order.forEach(function(id){var n=d.nz[id];rows.push([n.name,n.mpd?mpdName(n.mpd):'',fuelBy(n.fuel).name,n.first,n.last,n.T,n.L,n.A]);});
    rows.push(['Total','','','','',T.test,T.lit,T.sale]);

    title('OIL SALES BY PRODUCT');
    rows.push(['Product','Quantity','Amount']);
    var on=Object.keys(d.oil);
    on.forEach(function(k){rows.push([k,d.oil[k].q,d.oil[k].A]);});
    if(!on.length)rows.push(['No oil sold on this day']);
    rows.push(['Total',d.oilQ,T.oil]);

    title('CREDIT SALES BY CUSTOMER');
    rows.push(['Account','Customer','Fuel litres','Oil amount','Total credit']);
    var cn=Object.keys(d.credit);
    cn.forEach(function(k){var c=d.credit[k];rows.push([c.acc,c.name,c.L,c.oilA,c.A]);});
    if(!cn.length)rows.push(['No credit sales on this day']);
    rows.push(['Total','','','',T.credit]);

    title('OLD DUES COLLECTED');
    rows.push(['Date and time','Account','Customer','Paid by','Received by','Amount']);
    d.pays.forEach(function(p){rows.push([dtf(p.t),p.acc,p.name,p.mode,p.att,p.A]);});
    if(!d.pays.length)rows.push(['No old dues collected on this day']);
    rows.push(['Total','','','','',T.rec]);

    title('EXPENSES BY CATEGORY');

    if(!en.length)rows.push(['No expenses on this day']);
    rows.push(['Total',d.exTot]);

    title('FUEL STOCK');
    rows.push(['Date and time','Fuel','Type','Litres','Stock after','Note']);
    d.moves.forEach(function(e){rows.push([dtf(e.t),fuelBy(e.fuel).name,fuelLogLabel(e),e.qty||0,e.after,e.note||'']);});
    if(!d.moves.length)rows.push(['No deliveries or dip readings on this day']);

    title('STAFF ATTENDANCE');

    rows.push(['Present',ac.P],['Half day',ac.H],['Absent',ac.A],['Leave',ac.L],['Not marked',ac.none]);
    return {rows:rows,widths:[34,16,22,16,16,14,14,14,16,18,13,12,12,14,13,14,14,22,22]};

  /* ================= STAFF ATTENDANCE ================= */

  function setAtt(sid,date,patch){

    if(!a){a={sid:sid,date:date,st:'',tin:'',tout:'',shift:'',note:''};S.attend.push(a);}

  /* month */
  function monthInfo(m){var y=Number(m.slice(0,4)),mo=Number(m.slice(5,7));return {y:y,mo:mo,n:new Date(y,mo,0).getDate(),first:new Date(y,mo-1,1).getDay()};}
  function monthLabel(m){var i=monthInfo(m);return new Date(i.y,i.mo-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});}
  function monthData(m){
    var mi=monthInfo(m),tk=dayKey(Date.now()),rows=[];
    S.staff.forEach(function(s){
      var recs=S.attend.filter(function(a){return a.sid===s.id&&a.date.slice(0,7)===m;});
      if(s.active===false&&!recs.length)return;
      var c={P:0,H:0,A:0,L:0},byDay={};
      recs.forEach(function(a){if(a.st&&c[a.st]!==undefined){c[a.st]++;byDay[Number(a.date.slice(8,10))]=a;}});
      var upto=mi.n;
      if(m===tk.slice(0,7))upto=Number(tk.slice(8,10));else if(m>tk.slice(0,7))upto=0;
      var marked=0;for(var d=1;d<=upto;d++){if(byDay[d])marked++;}
      var days=c.P+c.H/2;
      var wages=s.wage>0?r2(days*s.wage):0;
      var nm=String(s.name||'').trim().toLowerCase(),sht=0,exc=0;
      S.shifts.forEach(function(sh){
        if(!sh.date||sh.date.slice(0,7)!==m)return;
        mpsOf(sh).forEach(function(mp){
          if(String(mp.att||'').trim().toLowerCase()!==nm)return;
          sht=r2(sht+shortOf(mp.diff));exc=r2(exc+excessOf(mp.diff));
        });
      });
      var dl=S.deds.filter(function(x){return x.sid===s.id&&x.date.slice(0,7)===m;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
      var adv=0,oth=0;
      dl.forEach(function(x){if(x.type==='adv')adv=r2(adv+x.A);else oth=r2(oth+x.A);});
      var bal=r2(wages-sht+(S.exCredit?exc:0)-adv-oth);
      rows.push({s:s,c:c,days:days,byDay:byDay,unmarked:Math.max(0,upto-marked),wages:wages,sht:sht,exc:exc,adv:adv,oth:oth,bal:bal,dl:dl});
    });
    return {m:m,mi:mi,rows:rows};
  }
  function payLines(r){
    function ln(a,b,c){return '<div class="line'+(c?' '+c:'')+'"><span>'+a+'</span><span>'+b+'</span></div>';}
    return ln('Days worked',r.days)+ln('Wages'+(r.s.wage>0?' ('+r.days+' \u00D7 '+money(r.s.wage)+')':''),money(r.wages))+
      ln('Short',r.sht?'\u2212 '+money(r.sht):money(0),r.sht?'bad':'')+
      ln('Excess'+(S.exCredit?'':' (not counted)'),(S.exCredit&&r.exc?'+ ':'')+money(r.exc),(S.exCredit&&r.exc)?'okc':'')+
      ln('Advance',r.adv?'\u2212 '+money(r.adv):money(0))+
      ln('Other expenses',r.oth?'\u2212 '+money(r.oth):money(0))+
      ln('Balance amount',money(r.bal),'strong '+(r.bal<0?'bad':'okc'));
  }
  function dedForm(r,m){
    var tk=dayKey(Date.now()),def=tk.slice(0,7)===m?tk:m+'-01',id=r.s.id;

  function monthRows(md){
    var rows=[],n=md.mi.n,days=[],wk=[],i;
    for(i=1;i<=n;i++){days.push(i);wk.push(['S','M','T','W','T','F','S'][new Date(md.mi.y,md.mi.mo-1,i).getDay()]);}
    rows.push([S.pump||'Pump Desk'],['Staff attendance'],[],['Month',monthLabel(md.m)],['Legend','P present, H half day, A absent, L leave'],['Balance','Wages - short - advance - other expenses'+(S.exCredit?' + excess':'')],[]);
    rows.push(['',''].concat(wk));
    rows.push(['Name','Role'].concat(days,['Present','Half days','Absent','Leave','Days worked','Not marked','Daily wage','Wages','Short','Excess','Advance','Other expenses','Balance']));
    md.rows.forEach(function(r){
      rows.push([r.s.name,r.s.role||''].concat(days.map(function(d){var a=r.byDay[d];return a?a.st:'';}),[r.c.P,r.c.H,r.c.A,r.c.L,r.days,r.unmarked,r.s.wage||'',r.wages||'',r.sht||0,r.exc||0,r.adv||0,r.oth||0,r.bal]));
    });
    return {rows:rows,widths:[24,14].concat(days.map(function(){return 4;}),[9,10,9,8,12,11,11,12,10,10,10,15,12])};
  }

  function useToggle(t){
    var b=$('mpb_'+t.getAttribute('data-use'));if(b)b.classList.toggle('hide',!t.checked);
    checkStart();
  }

  document.addEventListener('input',function(e){
    var t=e.target,sh=S.shift;
    if(t.id==='cq'){var q=t.value.trim().toLowerCase();[].forEach.call(document.querySelectorAll('.cust-row'),function(r){r.classList.toggle('hide',!!q&&r.getAttribute('data-s').indexOf(q)<0);});return;}
    if(t.hasAttribute('data-use')){useToggle(t);return;}
    if(t.hasAttribute('data-open')||t.hasAttribute('data-att')){checkStart();return;}
    if(t.hasAttribute('data-fdip')){dipLive(t);return;}
    if(t.hasAttribute('data-at')){var ao={};ao[t.getAttribute('data-at')]=t.value;setAtt(t.getAttribute('data-sid'),ui.attDate||dayKey(Date.now()),ao);return;}
    if(t.id==='os_q'||t.id==='os_p'){oilTotal();return;}
    if(!sh){
      if(t.id==='cs_L')linkSale('L');
      if(t.id==='cs_A')linkSale('A');
      return;
    }
    if(t.hasAttribute('data-test')||t.hasAttribute('data-terr')){
      var tid=t.getAttribute('data-test')||t.getAttribute('data-terr'),isT=t.hasAttribute('data-test');
      sh.nz.forEach(function(n){if(n.id===tid){if(isT)n.test=t.value;else n.terr=t.value;}});
      armClose=false;save();updateShift();return;
    }
    if(t.hasAttribute('data-first')){
      var fid=t.getAttribute('data-first'),fv=pf(t.value);
      sh.nz.forEach(function(n){if(n.id===fid&&!isNaN(fv)&&fv>=0){if(n.open0===undefined)n.open0=n.open;n.open=fv;}});
      armClose=false;save();updateShift();return;
    }
    if(t.hasAttribute('data-close')){
      var id=t.getAttribute('data-close');sh.nz.forEach(function(n){if(n.id===id)n.close=t.value;});
      armClose=false;save();updateShift();return;
    }
    if(t.hasAttribute('data-pay')){mpOf(sh,ui.mp)[t.getAttribute('data-pay')]=t.value;armClose=false;save();updateShift();return;}
    if(t.hasAttribute('data-den')){
      var m=mpOf(sh,ui.mp);m.den=m.den||{};m.den[t.getAttribute('data-den')]=t.value;
      (S.notes||[]).forEach(function(d){var a=$('da_'+d);if(a)a.textContent=money(d*am(m.den[d]));});
      var tot=denTotal(m);$('denTot').textContent=money(tot);
      m.cash=tot>0?String(tot):'';$('pc').value=m.cash;
      armClose=false;save();updateShift();return;
    }
    if(t.hasAttribute('data-cnote')){mpOf(sh,ui.mp).cashNote=t.value;save();return;}
    if(t.hasAttribute('data-mend')){mpOf(sh,ui.mp).endT=t.value;save();return;}
    if(t.hasAttribute('data-time')){
      if(t.getAttribute('data-time')==='t0'){var v=new Date(t.value).getTime();if(!isNaN(v)){sh.t0=v;sh.date=dayKey(v);var ds=$('dStart');if(ds)ds.textContent='Started '+dtm(v);}}
      else{sh.endT=t.value;}
      save();return;
    }
    if(t.id==='cs_L')linkSale('L');
    if(t.id==='cs_A')linkSale('A');
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.hasAttribute('data-use')){useToggle(t);return;}
    if(t.hasAttribute('data-fs')){
      var fz=S.fstock[t.getAttribute('data-fs')],fk=t.getAttribute('data-f'),nvv=pf(t.value);
      if(!fz)return;
      if(isNaN(nvv)||nvv<0){t.value=fz[fk]||'';toast('Enter a number');return;}
      fz[fk]=r2(nvv);t.value=fz[fk]||'';save();toast('Saved');return;
    }
    if(t.id==='at_date'){ui.attDate=t.value||dayKey(Date.now());render();return;}
    if(t.id==='am_exc'){S.exCredit=t.checked;save();render();return;}
    if(t.id==='am_month'){ui.attMonth=t.value||dayKey(Date.now()).slice(0,7);render();return;}
    if(t.hasAttribute('data-sf')){
      var sf=staffBy(t.getAttribute('data-sid')),sk=t.getAttribute('data-sf');
      if(!sf)return;
      if(sk==='active')sf.active=t.checked;
      else if(sk==='wage'){var wv=pf(t.value);sf.wage=(isNaN(wv)||wv<0)?0:r2(wv);t.value=sf.wage||'';}
      else if(sk==='name'){var snm=t.value.trim();if(!snm){t.value=sf.name;toast('Enter a name');return;}sf.name=snm;}
      else sf[sk]=t.value.trim();
      save();toast('Saved');return;
    }
    if(t.id==='dr_date'){ui.repDate=t.value||dayKey(Date.now());render();return;}
    if(t.id==='os_item'){oilPick();return;}
    if(t.hasAttribute('data-oil')){
      var oo=oilBy(t.getAttribute('data-oil')),fld=t.getAttribute('data-f');if(!oo)return;
      if(fld==='name'||fld==='pack'){
        var sv=t.value.trim();
        if(fld==='name'&&!sv){t.value=oo.name;toast('Enter a name');return;}
        oo[fld]=sv;
      }else{
        var nv=pf(t.value);
        if(isNaN(nv)||nv<0){t.value=oo[fld];toast('Enter a number');return;}
        oo[fld]=r2(nv);t.value=oo[fld];
      }
      save();toast('Saved');return;
    }
    if(t.id==='cs_fuel'){linkSale('L');return;}
    if(t.hasAttribute('data-price')){
      var f=fuelBy(t.getAttribute('data-price')),v=pf(t.value);
      if(isNaN(v)||v<=0){t.value=f.price;toast('Enter a price above zero');return;}
      f.price=r2(v);t.value=f.price;save();toast(f.name+' price updated');return;
    }
    if(t.hasAttribute('data-mpname')){S.mpds.forEach(function(m){if(m.id===t.getAttribute('data-mpname'))m.name=t.value.trim()||m.name;});save();toast('MPD updated');return;}
    if(t.hasAttribute('data-nzname')){S.nozzles.forEach(function(n){if(n.id===t.getAttribute('data-nzname'))n.name=t.value.trim()||n.name;});save();toast('Nozzle updated');return;}
    if(t.hasAttribute('data-nzfuel')){S.nozzles.forEach(function(n){if(n.id===t.getAttribute('data-nzfuel'))n.fuel=t.value;});save();toast('Nozzle updated');return;}
    if(t.hasAttribute('data-nzmpd')){S.nozzles.forEach(function(n){if(n.id===t.getAttribute('data-nzmpd'))n.mpd=t.value;});save();viewSet();toast('Nozzle moved');return;}
    if(t.id==='testTol'){var tv=pf(t.value);if(isNaN(tv)||tv<0){t.value=S.testTol;toast('Enter a number');return;}S.testTol=r2(tv);save();toast('Saved');return;}
    if(t.id==='noteVals'){
      var vs=t.value.split(/[ ,]+/).map(Number).filter(function(x){return x>0&&isFinite(x);});
      vs=vs.filter(function(x,i){return vs.indexOf(x)===i;}).sort(function(a,b){return b-a;});
      if(!vs.length){t.value=S.notes.join(', ');toast('Enter at least one note value');return;}
      S.notes=vs;t.value=vs.join(', ');save();toast('Note values saved');return;
    }
    if(t.id==='pumpName'){S.pump=t.value.trim();save();toast('Pump name saved');return;}
    if(t.id==='cur'){S.cur=t.value.trim()||'\u20B9';save();toast('Currency updated');return;}
  });
  document.addEventListener('click',function(e){
    var tb=e.target.closest('[data-tab]');
    if(tb){ui.tab=tb.getAttribute('data-tab');if(ui.tab!=='credit')ui.cust=null;render();window.scrollTo(0,0);return;}
    var b=e.target.closest('[data-act]');if(!b)return;
    var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
    switch(a){
      case 'startShift':startShift();break;
      case 'closeShift':closeShift();break;
      case 'discardShift':discardShift(b);break;
      case 'mEndNow':{var mo=mpOf(S.shift,ui.mp);mo.endT=toLocalInput(Date.now());save();render();toast('Closing time set to now');break;}
      case 'mEndClear':{mpOf(S.shift,ui.mp).endT='';save();render();break;}
      case 'endNow':S.shift.endT=toLocalInput(Date.now());save();render();toast('Closing time set to now');break;
      case 'endClear':S.shift.endT='';save();render();break;
      case 'testAdd':{
        var tn=S.shift?S.shift.nz.filter(function(n){return n.id===id;})[0]:null;if(!tn)return;
        tn.test=String(r2(am(tn.test)+5));var ti=$('t_'+id);if(ti)ti.value=tn.test;
        armClose=false;save();updateShift();break;
      }
      case 'editStart':{ui.mp='sum';render();var ts=$('tStart');if(ts){if(ts.scrollIntoView)ts.scrollIntoView({block:'center'});if(ts.focus)ts.focus();}break;}
      case 'editTimes':ui.editShift=(ui.editShift===id?null:id);render();break;
      case 'saveTimes':{
        var es=S.shifts.filter(function(x){return x.id===id;})[0];if(!es)return;
        var ns=new Date($('est_'+id).value).getTime(),ne=new Date($('eet_'+id).value).getTime();
        if(isNaN(ns)||isNaN(ne)){toast('Enter both the start and the closing time');return;}
        if(ne<ns){toast('The closing time is before the start time');return;}
        var emps=es.res.mps||[],etimes=[];
        for(var qi=0;qi<emps.length;qi++){
          var einp=$('emt_'+id+'_'+emps[qi].id),tv=einp?new Date(einp.value).getTime():ne;
          if(isNaN(tv))tv=ne;
          if(tv<ns){toast(emps[qi].name+' closing time is before the start time');return;}
          etimes.push(tv);
        }
        var enames=[],ename;
        if(emps.length){
          for(var qj=0;qj<emps.length;qj++){
            var nin=$('ean_'+id+'_'+emps[qj].id);ename=nin?nin.value.trim():emps[qj].att;
            if(!ename){toast('Enter the attendant name for '+emps[qj].name);return;}
            enames.push(ename);
          }
        }else{
          var nin2=$('ean_'+id+'_all');ename=nin2?nin2.value.trim():(es.att||'');
          if(!ename){toast('Enter the attendant name');return;}
          enames.push(ename);
        }
        es.t0=ns;es.t1=ne;es.date=dayKey(ns);
        emps.forEach(function(m,i){m.t1=etimes[i];});
        if(emps.length){
          emps.forEach(function(m,i){
            var oldN=m.att,newN=enames[i];m.att=newN;
            if(oldN!==newN){
              var fix=function(e){
                if(e.shift!==es.id)return;
                var mine=(e.mpd&&emps.some(function(x){return x.id===e.mpd;}))?e.mpd===m.id:i===0;
                if(mine)e.att=newN;
              };
              S.ledger.forEach(fix);S.expenses.forEach(fix);S.oilSales.forEach(fix);
            }
          });
          es.att=emps.map(function(m){return m.att;}).filter(Boolean).join(', ');
        }else{es.att=enames[0];}
        S.fuelLog.forEach(function(e){if(e.ref===es.id&&e.type==='sale')e.t=ne;});
        ui.editShift=null;save();render();toast('Changes saved');break;
      }
      case 'mpTab':ui.mp=id;armClose=false;render();window.scrollTo(0,0);break;
      case 'xClose':closeExportSheet();break;
      case 'xCopy':{
        var xta=$('xtext');
        var xdone=function(){toast('Copied. Paste it into Excel or Google Sheets');};
        var xfail=function(){
          if(xta){if(xta.focus)xta.focus();if(xta.select)xta.select();try{if(document.execCommand&&document.execCommand('copy')){xdone();return;}}catch(e){}}
          toast('Press and hold the text, choose Select all, then Copy');
        };
        try{navigator.clipboard.writeText(xfile.tsv).then(xdone,xfail);}catch(e){xfail();}
        break;
      }
      case 'xShare':{
        try{
          var xf=new File([xfile.bytes],xfile.name,{type:XLS_MIME});
          navigator.share({files:[xf],title:xfile.name}).catch(function(err){if(err&&err.name==='AbortError')return;toast('Sharing did not work here. Try Copy for Excel');});
        }catch(e){toast('Sharing did not work here. Try Copy for Excel');}
        break;
      }
      case 'xDownload':{
        try{
          var xb=new Blob([xfile.bytes],{type:XLS_MIME}),xu=URL.createObjectURL(xb),xa=document.createElement('a');
          xa.href=xu;xa.download=xfile.name;document.body.appendChild(xa);xa.click();
          setTimeout(function(){if(xa.parentNode)xa.parentNode.removeChild(xa);URL.revokeObjectURL(xu);},1500);
          toast('If nothing was saved, use Share or Copy for Excel');
        }catch(e){toast('Download did not work here. Try Copy for Excel');}
        break;
      }
      case 'stView':ui.stView=b.getAttribute('data-v');render();break;
      case 'attSet':{
        var adt=ui.attDate||dayKey(Date.now()),acur=attBy(id,adt),anv=b.getAttribute('data-v');
        setAtt(id,adt,{st:(acur&&acur.st===anv)?'':anv});render();break;
      }
      case 'attAllPresent':{
        var adt2=ui.attDate||dayKey(Date.now());
        activeStaff().forEach(function(st2){var a2=attBy(st2.id,adt2);if(!a2||!a2.st)setAtt(st2.id,adt2,{st:'P'});});
        render();toast('Everyone not yet marked is now present');break;
      }
      case 'addStaffToggle':ui.addStaff=!ui.addStaff;render();break;
      case 'saveStaff':{
        var sname=$('sf_name').value.trim();if(!sname){toast('Enter the name');return;}
        S.staff.push({id:'st'+uid(),name:sname,role:$('sf_role').value,phone:$('sf_phone').value.trim(),wage:r2(am($('sf_wage').value)),active:true});
        ui.addStaff=false;save();render();toast(sname+' added');break;
      }
      case 'delStaff':twoTap(b,'Tap again to remove',function(){
        S.staff=S.staff.filter(function(x){return x.id!==id;});
        S.attend=S.attend.filter(function(x){return x.sid!==id;});
        S.deds=S.deds.filter(function(x){return x.sid!==id;});
        save();render();toast('Staff removed');
      });break;
      case 'addDed':{
        var dty=$('dd_t_'+id).value,dam=pf($('dd_a_'+id).value),ddt=$('dd_d_'+id).value;
        if(isNaN(dam)||dam<=0){toast('Enter the amount');return;}
        if(!ddt){toast('Pick a date');return;}
        S.deds.push({id:uid(),sid:id,date:ddt,type:dty,A:r2(dam),note:$('dd_n_'+id).value.trim()});
        ui.openStaff=id;if(ddt.slice(0,7)!==(ui.attMonth||dayKey(Date.now()).slice(0,7)))ui.attMonth=ddt.slice(0,7);
        save();render();toast((dty==='adv'?'Advance':'Expense')+' added \u00B7 '+money(r2(dam)));break;
      }
      case 'delDed':twoTap(b,'Tap again to delete',function(){
        S.deds=S.deds.filter(function(x){return x.id!==id;});ui.openStaff=b.getAttribute('data-sid');
        save();render();toast('Deleted');
      });break;
      case 'exportAtt':exportAtt(id);break;
      case 'shareAtt':shareText(attSummaryText(monthData(id)),'Staff attendance '+id,'Summary copied');break;
      case 'copyAtt':copyText(attSummaryText(monthData(id)),'Summary copied');break;
      case 'repView':ui.repView=b.getAttribute('data-v');render();break;
      case 'openDay':ui.tab='rep';ui.repView='day';ui.repDate=id;render();window.scrollTo(0,0);break;
      case 'exportDay':exportDay(id);break;
      case 'shareDay':shareText(daySummaryText(dayData(id)),'Day sales report '+id,'Summary copied');break;
      case 'copyDay':copyText(daySummaryText(dayData(id)),'Summary copied');break;
      case 'exportShift':exportShift(id);break;
      case 'dismissClosed':ui.lastClosed=null;render();break;
      case 'cview':ui.cview=b.getAttribute('data-v');render();break;
      case 'addCustToggle':ui.addCust=!ui.addCust;render();break;
      case 'editCustToggle':ui.editCust=!ui.editCust;render();break;
      case 'saveCust':{
        var cn=$('cf_name').value.trim();if(!cn){toast('Enter the customer name');return;}
        var vals={name:cn,phone:$('cf_phone').value.trim(),addr:$('cf_addr').value.trim(),veh:$('cf_veh').value.trim().toUpperCase(),limit:am($('cf_limit').value),due:Math.round(am($('cf_due').value))};
        if(id){
          var nobE=r2(am($('cf_open').value)),odE=oldDues(id),dRawE=$('cf_odate').value,dT=dRawE?new Date(dRawE+'T00:00:00').getTime():NaN;
          if(isNaN(dT))dT=odE.t||Date.now();
          var sameDate=odE.t!=null&&dayKey(dT)===dayKey(odE.t);
          if(nobE!==odE.A||(nobE>0&&!sameDate)){
            if(r2(balOf(id)-odE.A+nobE)<0){toast('Payments already received are more than that. Raise the old dues or check the payments.');return;}
            var prevE=S.ledger.filter(function(e){return e.cust===id&&e.type==='open';})[0];
            S.ledger=S.ledger.filter(function(e){return !(e.cust===id&&e.type==='open');});
            if(nobE>0){
              var oe={id:uid(),cust:id,t:dT,type:'open',A:nobE,shift:null};
              if(nobE!==odE.A){if(odE.A>0)oe.was=odE.A;}else if(prevE&&prevE.was!=null){oe.was=prevE.was;}
              S.ledger.push(oe);
            }
          }
          Object.assign(custBy(id),vals);ui.editCust=false;toast('Account updated');
        }
        else{
          var nc={id:uid(),acc:nextAcc(S.customers),t:Date.now()};Object.assign(nc,vals);S.customers.push(nc);
          var ob=am($('cf_open').value),odRaw=$('cf_odate').value,odT=odRaw?new Date(odRaw+'T00:00:00').getTime():Date.now();if(isNaN(odT))odT=Date.now();
          if(ob>0)S.ledger.push({id:uid(),cust:nc.id,t:odT,type:'open',A:r2(ob),shift:null});
          ui.addCust=false;toast('Account '+nc.acc+' created');
        }
        save();render();break;
      }
      case 'editOldDues':{ui.editCust=true;render();var od1=$('cf_open');if(od1){if(od1.scrollIntoView)od1.scrollIntoView({block:'center'});if(od1.focus)od1.focus();}break;}
      case 'openCust':ui.cust=id;ui.editCust=false;render();window.scrollTo(0,0);break;
      case 'backCust':ui.cust=null;ui.editCust=false;render();break;
      case 'per':ui.per=b.getAttribute('data-v');render();break;
      case 'shareStmt':{var sc=custBy(id);shareText(stmtText(sc,ui.per||'month'),'Account statement '+sc.acc);break;}
      case 'copyStmt':copyText(stmtText(custBy(id),ui.per||'month'));break;
      case 'addSale':{
        var sh=S.shift;if(!sh){toast('Start a shift first');return;}
        var f=$('cs_fuel').value,p=sh.prices[f]||fuelBy(f).price||0,L=am($('cs_L').value),A=am($('cs_A').value);
        if(!A&&L)A=r2(L*p);
        if(!L&&A&&p)L=r2(A/p);
        if(!(A>0)||!(L>0)){toast('Enter litres or an amount');return;}
        var c=custBy(id),bal=balOf(id);
        if(c.limit>0&&bal+A>c.limit){toast('Over the credit limit of '+money(c.limit)+' ('+money(Math.max(0,c.limit-bal))+' left)');return;}
        var mm=pickMp('cs_mp');
        S.ledger.push({id:uid(),cust:id,t:Date.now(),type:'sale',fuel:f,L:r2(L),A:r2(A),veh:$('cs_veh').value.trim().toUpperCase(),shift:sh.id,sn:sh.name,mpd:mm.id,mn:mm.name,att:mm.att});
        save();toast('Credit sale added \u00B7 '+money(A));render();break;
      }
      case 'addPay':{
        var pa=am($('cp_A').value);if(!(pa>0)){toast('Enter the amount received');return;}
        if(pa>balOf(id)){toast('That is more than the '+money(balOf(id))+' due');return;}
        var ps=S.shift,pm=ps?pickMp('cp_mp'):null;
        S.ledger.push({id:uid(),cust:id,t:Date.now(),type:'pay',A:r2(pa),mode:$('cp_mode').value,note:$('cp_note').value.trim(),shift:ps?ps.id:null,sn:ps?ps.name:'',mpd:pm?pm.id:null,mn:pm?pm.name:'',att:pm?pm.att:''});
        save();toast('Payment recorded \u00B7 '+money(pa));render();break;
      }
      case 'delLedger':twoTap(b,'Tap again to delete',function(){S.ledger=S.ledger.filter(function(x){return x.id!==id;});save();toast('Entry deleted');render();});break;
      case 'addExp':{
        var ea=am($('ex_A').value);if(!(ea>0)){toast('Enter the amount');return;}
        var es=S.shift,em=es?pickMp('ex_mp'):null;
        S.expenses.push({id:uid(),t:Date.now(),cat:$('ex_cat').value,A:r2(ea),note:$('ex_note').value.trim(),shift:es?es.id:null,mpd:em?em.id:null,mn:em?em.name:'',att:em?em.att:''});
        save();toast('Expense added \u00B7 '+money(ea));render();break;
      }
      case 'delExp':twoTap(b,'Tap again to delete',function(){S.expenses=S.expenses.filter(function(x){return x.id!==id;});save();toast('Expense deleted');render();});break;
      case 'dipMode':ui.dipMode=ui.dipMode||{};ui.dipMode[id]=b.getAttribute('data-v');render();break;
      case 'chartSave':{
        var cf=S.fstock[id];if(!cf)return;
        var pc=parseChart($('fch_'+id).value);
        if(pc.error){toast(pc.error);return;}
        cf.chart=pc.pts;cf.unit=$('fu_'+id).value.trim()||'cm';
        if(!(cf.cap>0))cf.cap=pc.pts[pc.pts.length-1][1];
        save();render();toast('Dip chart saved \u00B7 '+pc.pts.length+' readings');break;
      }
      case 'chartClear':twoTap(b,'Tap again to clear',function(){var cc=S.fstock[id];if(cc){delete cc.chart;}save();render();toast('Dip chart cleared');});break;
      case 'stockView':ui.stockView=b.getAttribute('data-v');render();break;
      case 'fuelAdd':{
        var fa1=S.fstock[id];if(!fa1)return;
        if(fa1.stock==null){toast('Set the starting stock with a dip reading first');return;}
        var fq=am(document.querySelector('[data-fd="'+id+'"]').value);
        if(!(fq>0)){toast('Enter the litres received');return;}
        var ft=new Date(document.querySelector('[data-ft="'+id+'"]').value).getTime();if(isNaN(ft))ft=Date.now();
        fa1.stock=r2(fa1.stock+fq);
        S.fuelLog.push({id:uid(),t:ft,fuel:id,type:'delivery',qty:r2(fq),after:fa1.stock,note:document.querySelector('[data-fn="'+id+'"]').value.trim()});
        save();render();
        toast(fa1.cap>0&&fa1.stock>fa1.cap?'Delivery added, but it is above the tank capacity. Check the dip.':'Delivery added \u00B7 '+fmt(fq)+' L');break;
      }
      case 'fuelDip':{
        var fd1=S.fstock[id];if(!fd1)return;
        var dRaw=pf(document.querySelector('[data-fdip="'+id+'"]').value),dv=dRaw,dnote=null,dci=chartInfo(fd1);
        if(dci&&dipMode(id)==='h'){
          if(isNaN(dRaw)||dRaw<0){toast('Enter the dip height in '+(fd1.unit||'cm'));return;}
          dv=chartLitres(fd1.chart,dRaw);
          if(dv==null){toast('That reading is outside the chart ('+dci.lo+' to '+dci.hi+' '+(fd1.unit||'cm')+')');return;}
          dnote=dRaw+' '+(fd1.unit||'cm')+' on the chart';
        }
        if(isNaN(dv)||dv<0){toast('Enter the dip reading in litres');return;}
        var sold=fuelSold(),before=fuelNow(id,sold),firstSet=fd1.stock==null;
        fd1.stock=r2(dv);
        if(S.shift){S.shift.fa=S.shift.fa||{};S.shift.fa[id]=sold[id]||0;}
        var vr=firstSet?0:r2(dv-before);
        S.fuelLog.push({id:uid(),t:Date.now(),fuel:id,type:'dip',qty:vr,before:before,after:fd1.stock,note:(firstSet?'Starting stock':'Dip reading')+(dnote?' \u00B7 '+dnote:'')});
        save();render();
        toast(firstSet?'Starting stock set':(vr===0?'Dip matches the book stock':'Dip is '+fmt(Math.abs(vr))+' L '+(vr>0?'more':'less')+' than the book stock'));break;
      }
      case 'delFuelLog':twoTap(b,'Tap again to delete',function(){
        var le=S.fuelLog.filter(function(x){return x.id===id;})[0];if(!le||le.type!=='delivery')return;
        var fl=S.fstock[le.fuel];if(fl&&fl.stock!=null)fl.stock=r2(fl.stock-le.qty);
        S.fuelLog=S.fuelLog.filter(function(x){return x.id!==id;});save();render();toast('Delivery deleted');
      });break;
      case 'oilView':ui.oilView=b.getAttribute('data-v');render();break;
      case 'oilPay':{
        ui.oilPay=b.getAttribute('data-v');
        [].forEach.call($('os_pay').children,function(x){x.setAttribute('aria-pressed',x===b);});
        var oc=$('os_credit');if(oc)oc.classList.toggle('hide',ui.oilPay!=='Credit');
        break;
      }
      case 'addOilToggle':ui.oilDraft=null;ui.addOil=!ui.addOil;render();break;
      case 'oilVariant':{var vo=oilBy(id);if(!vo)return;ui.oilDraft={name:vo.name,pack:''};ui.addOil=true;render();window.scrollTo(0,0);break;}
      case 'oilChip':{var nn=$('np_name');if(nn)nn.value=b.getAttribute('data-v');break;}
      case 'saveOil':{
        var onm=$('np_name').value.trim();if(!onm){toast('Enter the product name');return;}
        var opk=$('np_pack').value.trim();
        if(S.oils.some(function(o){return o.name.toLowerCase()===onm.toLowerCase()&&(o.pack||'').toLowerCase()===opk.toLowerCase();})){toast('That product and pack size already exists');return;}
        S.oils.push({id:'o'+uid(),name:onm,pack:$('np_pack').value.trim(),price:r2(am($('np_price').value)),stock:r2(am($('np_stock').value)),min:r2(am($('np_min').value))});
        ui.addOil=false;ui.oilDraft=null;save();render();toast('Product added');break;
      }
      case 'oilAdd':{
        var po=oilBy(id),qa=am(document.querySelector('[data-oiladd="'+id+'"]').value);
        if(!po)return;if(!(qa>0)){toast('Enter the units received');return;}
        po.stock=r2(po.stock+qa);save();render();toast('Added '+fmtQ(qa)+' to '+po.name);break;
      }
      case 'oilSet':{
        var ps=oilBy(id),qs=pf(document.querySelector('[data-oilset="'+id+'"]').value);
        if(!ps)return;if(isNaN(qs)||qs<0){toast('Enter the counted stock');return;}
        ps.stock=r2(qs);save();render();toast(ps.name+' stock set to '+fmtQ(qs));break;
      }
      case 'delOilProd':twoTap(b,'Tap again to remove',function(){S.oils=S.oils.filter(function(o){return o.id!==id;});save();render();toast('Product removed');});break;
      case 'addOil':{
        var osh=S.shift;if(!osh){toast('Start a shift first');return;}
        var pr=oilBy($('os_item').value);if(!pr){toast('Choose a product');return;}
        var q=am($('os_q').value),price=am($('os_p').value);
        if(!(q>0)||!(price>0)){toast('Enter the quantity and the price');return;}
        if(q>pr.stock){toast('Only '+fmtQ(pr.stock)+' in stock');return;}
        var opay=ui.oilPay||'Cash',oc2=null,OA=r2(q*price);
        if(opay==='Credit'){
          oc2=$('os_cust')?custBy($('os_cust').value):null;
          if(!oc2){toast('Choose a credit customer');return;}
          var ob2=balOf(oc2.id);
          if(oc2.limit>0&&ob2+OA>oc2.limit){toast('Over the credit limit of '+money(oc2.limit)+' ('+money(Math.max(0,oc2.limit-ob2))+' left)');return;}
        }
        var om=pickMp('os_mp'),oid=uid(),lid=null,now=Date.now();
        pr.stock=r2(pr.stock-q);
        if(oc2){
          lid=uid();
          S.ledger.push({id:lid,cust:oc2.id,t:now,type:'sale',item:oilLabel(pr),q:q,L:0,A:OA,veh:'',shift:osh.id,sn:osh.name,mpd:om.id,mn:om.name,att:om.att,oilId:oid});
        }
        S.oilSales.push({id:oid,t:now,item:pr.id,name:pr.name,pack:pr.pack||'',q:q,price:price,A:OA,pay:opay,cust:oc2?oc2.id:null,lid:lid,shift:osh.id,sn:osh.name,mpd:om.id,mn:om.name,att:om.att});
        save();render();toast('Oil sale recorded \u00B7 '+money(OA));break;
      }
      case 'delOil':twoTap(b,'Tap again to delete',function(){
        var es=S.oilSales.filter(function(x){return x.id===id;})[0];if(!es)return;
        var ep=oilBy(es.item);if(ep)ep.stock=r2(ep.stock+es.q);
        if(es.lid)S.ledger=S.ledger.filter(function(x){return x.id!==es.lid;});
        S.oilSales=S.oilSales.filter(function(x){return x.id!==id;});
        save();render();toast('Oil sale deleted and stock restored');
      });break;
      case 'addMpd':S.mpds.push({id:'m'+uid(),name:'MPD '+(S.mpds.length+1)});save();render();break;
      case 'delMpd':
        if(S.mpds.length<2){toast('Keep at least one MPD');return;}
        if(S.nozzles.some(function(n){return n.mpd===id;})){toast('Move or remove its nozzles first');return;}
        S.mpds=S.mpds.filter(function(m){return m.id!==id;});save();render();break;
      case 'addNozzle':S.nozzles.push({id:'n'+uid(),name:'Nozzle '+(S.nozzles.length+1),fuel:S.fuels[0].id,mpd:S.mpds.some(function(m){return m.id===id;})?id:S.mpds[0].id});save();render();break;
      case 'quickSetup':
        if(S.shift){toast('Close or discard the open shift first');return;}
        twoTap(b,'Tap again to replace the nozzles',function(){
          var a1=S.mpds[0]?S.mpds[0].name:'MPD 1',a2=S.mpds[1]?S.mpds[1].name:'MPD 2';
          S.mpds=[{id:'m1',name:a1},{id:'m2',name:a2}];S.nozzles=defNozzles();
          save();render();toast('Set up 2 MPDs with 4 nozzles each');
        });break;
      case 'delNozzle':S.nozzles=S.nozzles.filter(function(n){return n.id!==id;});save();render();break;
      case 'reset':twoTap(b,'Tap again to delete everything',function(){S=fresh();save();ui={tab:'shift',mp:null,cview:'customers',cust:null,addCust:false,editCust:false,per:'month',lastClosed:null,oilView:'sell',oilPay:'Cash',addOil:false,stockView:'fuel'};toast('All data deleted');render();});break;
    }
  });

  render();
})();
</script>
